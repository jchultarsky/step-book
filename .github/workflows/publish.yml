name: Build and deploy book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Render HTML and PDF
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check the book against the published EXPRESS schemas
        run: |
          python3 tools/check_book.py
          python3 tools/check_appendix_b.py
          python3 tools/check_strings.py
          python3 tools/check_availability.py
          python3 tools/check_listings.py
          python3 tools/check_references.py
          python3 tools/render_examples.py --check

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Render book
        run: quarto render

      - name: Validate the EPUB
        run: |
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip -d "$RUNNER_TEMP"
          java -jar "$RUNNER_TEMP/epubcheck-5.4.0/epubcheck.jar" --failonwarnings _book/inside-the-step-file.epub

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _book

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
